name: deploy to vps

on:
 push:
  branches: [deploy]

jobs:
 deploy:
  runs-on: ubuntu-latest
  
  steps:
  - name: Checkout Repo
    uses: actions/checkout@v4

  - name: Create ENV File
    run: |
      cat <<EOF > .env
      POSTGRES_DB=${{secrets.POSTGRES_DB}}
      ADMIN_USERNAME=${{secrets.ADMIN_USERNAME}}
      ADMIN_PASSWORD=${{secrets.ADMIN_PASSWORD}}
      ADMIN_EMAIL=${{secrets.ADMIN_EMAIL}}
      AUTH_TOKEN_KEY=${{secrets.AUTH_TOKEN_KEY}}
      AUTH_TOKEN_EXPIRATION=${{secrets.AUTH_TOKEN_EXPIRATION}}
      EOF

  - name: Set UP Docker Build X
    uses: docker/setup-buildx-action@v3

  - name: Set Up SSH
    uses: webfactory/ssh-agent@v0.9.1
    with: 
     ssh-private-key: ${{secrets.VPS_KEY}}    

  - name: Add VPS To Known Hosts
    run: |
      mkdir -p ~/.ssh
      ssh-keyscan -H "${{secrets.VPS_HOST}}" >> ~/.ssh/known_hosts

  - name: Copy env to VPS
    run: |
      ssh -o StrictHostKeyChecking=no \
         ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
         "mkdir -p ~/FoodFarm"

      scp -o StrictHostKeyChecking=no \
         .env \
         ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/${{ secrets.VPS_USER }}/FoodFarm/
         
     
  - name: Build Docker Image
    run: docker compose -f docker-compose.prod.yml build --pull

  - name: Save Docker Image as TAR
    run: |
      mkdir -p images
      docker save food-farm-microservice-account > images/food-farm-microservice-account.tar

  - name: Copy Image To VPS
    run: |
      scp -o StrictHostKeyChecking=no \
       images/*.tar \
       ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/${{ secrets.VPS_USER }}/FoodFarm/
  
      scp: |
        scp -o StrictHostKeyChecking=no \
         docker-compose.prod.yml \
         ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/${{ secrets.VPS_USER }}/FoodFarm/

  - name: Deploy On VPS
    run: |
        ssh -o StrictHostKeyChecking=no \
         ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          echo "Loading docker images..."
          for img in /home/${{ secrets.VPS_USER }}/FoodFarm/*.tar; do
            docker load -i "$img"
          done
          echo "Deleting *.tar"
          rm /home/${{ secrets.VPS_USER }}/FoodFarm/*.tar
          echo "Starting containers"
          docker compose -f /home/${{ secrets.VPS_USER }}/FoodFarm/docker-compose.prod.yml up -d --remove-orphans
         EOF
         
         

      