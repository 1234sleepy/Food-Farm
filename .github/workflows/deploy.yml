name: deploy to vps

on:
 push:
  branches: [deploy]

jobs:
 deploy:
  runs-on: ubuntu-latest
  
  steps:
  - name: Checkout Repo
    uses: actions/checkout@v4

  - name: Create ENV File
    run: |
      cat <<EOF > .env
      POSTGRES_DB=${{vars.POSTGRES_DB}}
      ADMIN_USERNAME=${{vars.ADMIN_USERNAME}}
      ADMIN_PASSWORD=${{vars.ADMIN_PASSWORD}}
      ADMIN_EMAIL=${{vars.ADMIN_EMAIL}}
      AUTH_TOKEN_KEY=${{vars.AUTH_TOKEN_KEY}}
      AUTH_TOKEN_EXPIRATION=${{vars.AUTH_TOKEN_EXPIRATION}}
      EOF

  - name: Set UP Docker Build X
    uses: docker/setup-buildx-action@v3

  - name: Set Up SSH
    uses: webfactory/ssh-agent@v0.9.1
    with: 
     ssh-private-key: ${{secrets.VPS_KEY}}    

  - name: Add VPS To Known Hosts
    run: |
      mkdir -p ~/.ssh
      ssh-keyscan -H "${{vars.VPS_HOST}}" >> ~/.ssh/known_hosts

  - name: Copy env to VPS
    run: |
      scp -o StrictHostKeyChecking=no \
         .env \
         ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:/home/${{ vars.VPS_USER }}/FoodFarm/
         
     
    