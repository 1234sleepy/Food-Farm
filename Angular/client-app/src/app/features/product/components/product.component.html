<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
<div class="container-fluid pt-5">

    <div class="row pt-5 blurBack">
        <div class="col-md-6 mb-4 ">
            <div class="card">
            <div class="tpw mb-4">

                <ngb-carousel #carousel [interval]="3000" [pauseOnHover]="pauseOnHover" [pauseOnFocus]="pauseOnFocus"
                    (slide)="onSlide($event)">
                    @for (img of product.images; track img; let i = $index) {
                    <ng-template ngbSlide>
                        <div class="picsum-img-wrapper">
                            <img [src]="img.imageUrl" alt="My image {{ i + 1 }} description" class="card-img-top"
                                style="height: 250px;" />
                        </div>
                    </ng-template>
                    }
                </ngb-carousel>
            </div>
                <div class="card-body">
                    <div class="row g-2">
                        <div class="col-3" *ngFor="let img of product.images">
                            <img src="{{img.imageUrl}}"
                                class="img-thumbnail" alt="Thumbnail 1">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <h1 class="h2 mb-3">{{product.name}}</h1>
            <div class="mb-3" *ngIf="product._isDiscounted">
                <span class="h4 me-2">{{product._priceWithDiscount}}</span>
                <span class="text-muted text-decoration-line-through">{{product.price}}</span>
            </div>
            <div class="mb-3">
                <span class="h4 me-2">{{product.price}}</span>
            </div>

            <div class="mb-3">
                <div class="col text-start">
                    <ngb-rating [(rate)]="product._rating" [max]="5" class="d-inline" [disabled]="true"/>
                    <pre class="d-inline"><b> {{product._rating | number : '1.2-2'}}</b></pre>
                </div>
            </div>



                <div class="mb-4">
                    <div class="d-flex align-items-center">
                        <label class="me-2">Quantity:</label>
                        <select class="form-select w-auto" [(ngModel)]="product._quantity">
                            <option *ngFor="let item of maxQuantity">{{item}}</option>
                        </select>
                    </div>
                </div>

            <div class="d-grid gap-2">
                <button class="btn btn-primary" type="button" (click)="add(product)">Add to Cart</button>
            </div>
        </div>

        <div class="text-center mt-5 pt-2">
            <div ngbNav #nav="ngbNav" [(activeId)]="active" class="nav-pills" (activeIdChange)="changeUrl()">
                <ng-container ngbNavItem="description">
                    <button ngbNavLink>Description</button>
                    <ng-template ngbNavContent>
                        <app-description-tab description="{{product.description}}"></app-description-tab>
                    </ng-template>
                </ng-container>

                <ng-container ngbNavItem="characteristics">
                    <button ngbNavLink>Characteristics</button>
                    <ng-template ngbNavContent>
                        <app-characteristics-tab></app-characteristics-tab>
                    </ng-template>
                </ng-container>

                <ng-container ngbNavItem="comments">
                    <button ngbNavLink>Comments</button>
                    <ng-template ngbNavContent>
                        <app-comments-tab></app-comments-tab>
                    </ng-template>
                </ng-container>


            </div>

            <div [ngbNavOutlet]="nav" class="ms-4"></div>
        </div>
    </div>
</div>
