<div>
  <div class="row">
    <div class="col">
      <div class="tm-bg-primary-dark tm-block tm-block-h-auto">
        <div class="row">
          <div class="col-12">
            <h2 class="tm-block-title d-inline-block">Add Product</h2>
          </div>
        </div>
        <div class="row tm-edit-product-row">
          <div class="col-12">
            <div aclass="tm-edit-product-form">
              <div class="form-group mb-3">
                <label for="name">Product Name </label>
                <input
                  id="name"
                  name="name"
                  type="text"
                  class="form-control validate"
                  required
                  [(ngModel)]="this.newProduct.name"
                />
              </div>
              <div class="form-group mb-3">
                <label for="description">Description</label>
                <app-rich-text-area
                  (changeRichTextArea)="newProduct.description = $event"
                />
              </div>
              <div class="form-group mb-3">
                <label for="labels">Labels</label>

                <ng-select
                  [multiple]="true"
                  style="color: white"
                  [(ngModel)]="this.newProduct.labels"
                  name="labels"
                >
                  @for (
                    lab of this.labelsService.labelList$ | async;
                    track lab
                  ) {
                    <ng-option
                      style="background-color: blue"
                      [value]="lab.id"
                      >{{ lab.name }}</ng-option
                    >
                  }
                </ng-select>
              </div>
              <div class="row">
                <div class="form-group mb-3 col-xs-12 col-sm-6">
                  <label for="stock">Price </label>
                  <input
                    id="stock"
                    name="stock"
                    type="text"
                    class="form-control validate"
                    required
                    [(ngModel)]="this.newProduct.price"
                  />
                </div>
                <div class="form-group col">
                  <label for="stock">Units In Stock </label>
                  <input
                    id="stock"
                    name="stock"
                    type="text"
                    class="form-control validate"
                    required
                    [(ngModel)]="this.newProduct.quantityLimit"
                    [max]="100"
                    [min]="0"
                  />
                </div>
                <div class="form-group mb-3 col-12">
                  <label for="stock">Discount(Price = Price - Discount) </label>
                  <input
                    id="stock"
                    name="stock"
                    type="text"
                    class="form-control validate"
                    required
                    [(ngModel)]="this.newProduct.discountPrice"
                  />
                </div>
              </div>
              <div class="col-12">
                <button
                  type="submit"
                  class="btn btn-primary btn-block text-uppercase"
                  (click)="resultButtonClick()"
                >
                  Add Product Now
                </button>
              </div>
              />
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
