<div class="container-fluid" style="height: 100vh; overflow-y: scroll !important;">
    <div class="row">
        <div class="col">
            <h3 class="text-center mt-2">Admin Panel</h3>
            <button class="btn btn-danger" (click)="logout()">Log Out</button>
            <button class="btn btn-danger" style="margin-left: 14px;" (click)="homePage()">Home Page</button>
        </div>


        <div class="d-flex  mt-5">
            <div ngbNav #nav="ngbNav" [(activeId)]="active" class="nav-pills flex-column" orientation="vertical" (activeIdChange)="changeUrl()">
                <ng-container ngbNavItem="product">
                    <button ngbNavLink>Product</button>
                    <ng-template ngbNavContent>
                        <app-product-tab></app-product-tab>
                    </ng-template>
                </ng-container> 
                <ng-container ngbNavItem="order">
                    <button class="text-light" ngbNavLink>Order</button>
                    <ng-template ngbNavContent>
                        <app-order-tab></app-order-tab>
                    </ng-template>
                </ng-container>
            </div>

            <div [ngbNavOutlet]="nav" class="ms-4"></div>
        </div>
    </div>
</div>
