 <div *ngFor="let product of pagination.list" class="col-sm-6 col-md-5 col-lg-6 mt-3">
                    <div class="col-md-10">
                        <div class="row p-2 bg-white border rounded">
                            <div class="col-md-3 mt-1"><img class="img-fluid img-responsive rounded product-image"
                                    src="{{product._mainImageUrl}}"></div>
                            <div class="col-md-6 mt-1">
                                <h5>{{product.name}}</h5>
                                <div class="d-flex flex-row">
                <div class="col text-start">
                    <ngb-rating [(rate)]="product._rating" [max]="5" class="d-inline" [disabled]="true"/>
                    <pre class="d-inline"><b> {{product._rating | number : '1.2-2'}}</b></pre>
                </div>
                                </div>
    
                                <p class="text-justify text-truncate para mb-0" [innerHTML]="product.description.slice(0,50).trim() + '...'"><br><br>
                                </p>
                            </div>
                            <div class="align-items-center align-content-center col-md-3 border-left mt-1">
                                <div class="d-flex flex-row align-items-center">
                                    <h4 class="mr-1">{{product.price}}</h4>
                                </div>
                                <div class="d-flex flex-column mt-4"><button class="btn btn-primary btn-sm"
                                        type="button" (click)="changeUrl(product.id)">Details</button></div>
                            </div>
                        </div>
                    </div>
                </div>
