name: "food-farm-microservice"

networks:
 default:
  name: "shop-microservice"

volumes:
 shop-db:
 order-api:
 cart-api:
 account-api:
 product-api:
 shop-grafana:
 shop-jaeger:
 
services:
  postgres:
    container_name: "shop-db"
    image: "postgres:latest"
    ports:
      - "5432:5432"  
    environment: 
      POSTGRES_PASSWORD: "postgrespw"
    volumes:
      - shop-db:/var/lib/postgresql/

  prometheus:
     container_name: "shop-prometheus"
     image: "prom/prometheus:latest"
     ports :
       - "9090:9090"
     volumes:
       - ./prometheus.yml:/etc/prometheus/prometheus.yml
  
  grafana:
     container_name: "shop-grafana"
     image: "grafana/grafana:latest"
     restart: unless-stopped
     ports:
       - "3000:3000"
     environment:
       - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
     volumes:
       - shop-grafana:/var/lib/grafana

  jaeger:
    container_name: "shop-jaeger"
    image: "jaegertracing/all-in-one:1.9"
    environment: 
      COLLECTOR_ZIPKIN_HTTP_PORT: 9411
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "9411:9411"
      - "16686:16686"
      - "4317:4317"
      - "14268:14268"
    volumes:
      - shop-jaeger:/var/lib/jaeger

  gateway-api:
    build:
      context: ./GateWay/
    container_name: "gateway-api"
    ports:
      - "5009:5009"
    environment:
      ASPNETCORE_URLS: "http://+:5009"
    depends_on:
      - product-api
      - order-api
      - cart-api
      - account-api

  product-api:
    build:
      context: ./Product.MicroService/
    container_name: "product-api"
    ports:
      - "5010:5010"
    environment:
      ASPNETCORE_URLS: "http://+:5010"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=shop-db;Username=postgres;Password=postgrespw"
    depends_on:
      - postgres
  
  order-api:
    build:
      context: ./Order.MicroService/
    container_name: "order-api"
    ports:
      - "5011:5011"
    environment:
      ASPNETCORE_URLS: "http://+:5011"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=shop-db;Username=postgres;Password=postgrespw"
    depends_on:
      - postgres

  cart-api:
    build:
      context: ./Cart.MicroService/
    container_name: "cart-api"
    ports:
      - "5012:5012"
    environment:
      ASPNETCORE_URLS: "http://+:5012"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=shop-db;Username=postgres;Password=postgrespw"
    depends_on:
      - postgres

  account-api:
    build:
      context: ./Account.MicroService/
    container_name: "account-api"
    ports:
      - "5013:5013"
    environment:
      ASPNETCORE_URLS: "http://+:5013"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=shop-db;Username=postgres;Password=postgrespw"
      AdminCredentials__Username: "admin"
      AdminCredentials__Password: "Password123!"
      AdminCredentials__Email: "testemail@gmail.com"
      Auth__TokenKey: "This is a very long key that is used to sign the JWT token. It should be at least 32 characters long ffffsgfdsgfdsgfsdgf."
      Auth__TokenExprirationDays: "7"
    depends_on:
      - postgres
